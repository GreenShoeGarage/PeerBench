services:
  peerbench:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      DATA_DIR: /app/data
      MAX_ROOM_MB: "64"
      MAX_ROOMS: "200"
      # If the frontend lives on a different host, set its exact origin(s):
      # ALLOWED_ORIGINS: https://your-static-site.example
    volumes:
      - peerbench-data:/app/data
      - ./config.json:/app/config.json:ro
volumes:
  peerbench-data:
